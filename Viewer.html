<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#babcbc;font:14px Arial,sans-serif}canvas{display:block}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#babcbc;z-index:5}a,button{color:inherit}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:4}nav a,nav button,.previous{border:1px solid #ffffff80;background:#191919b8;color:white;backdrop-filter:blur(8px);border-radius:28px;padding:12px 22px;text-decoration:none;font-weight:600;white-space:nowrap;cursor:pointer}.previous{position:fixed;top:16px;right:16px;padding:9px 14px;font-size:12px;z-index:6}#settings{position:fixed;top:16px;left:16px;padding:18px;background:#111d;color:white;border-radius:12px;z-index:4;width:240px}#settings label{display:block;margin:12px 0}#settings input[type=range]{width:100%}#settings[hidden]{display:none}#settings button{padding:8px;margin:5px;border:0;border-radius:6px;cursor:pointer}#error{max-width:360px;padding:20px}#error:empty{display:none}@media(max-width:500px){nav{bottom:16px}nav a,nav button{padding:11px 16px}#settings{top:62px;width:210px}}
</style>
</head>
